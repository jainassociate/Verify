name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Inject secrets into config.js ──────────────────────────────────────
      # Secrets are read from GitHub environment secrets at build time.
      # The generated config.js is NEVER committed to the repo.
      - name: Generate runtime config from secrets
        env:
          DOMAIN_ENDPOINT: ${{ secrets.DOMAIN_ENDPOINT }}
          BEARER_TOKEN: ${{ secrets.BEARER_TOKEN }}
        run: |
          printf 'window.APP_CONFIG = { DOMAIN_ENDPOINT: "%s", BEARER_TOKEN: "%s" };\n' \
            "$DOMAIN_ENDPOINT" \
            "$BEARER_TOKEN" \
          > assets/js/config.js
          echo "✅ config.js generated (values hidden)"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
